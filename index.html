<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déverrouiller un PDF</title>
<meta name="description" content="Retire la protection d'un fichier PDF directement dans le navigateur, sans envoyer le fichier sur un serveur.">
<meta name="theme-color" content="#12181c">
 
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
 
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
 
  <div class="topbar">
    <button id="installBtn" class="install-btn hidden">Installer l'application</button>
  </div>
 
  <div class="panel">
 
    <!-- ÉTAPE : sélection du fichier -->
    <div id="step-drop">
      <div class="dropzone" id="dropzone">
        <div class="hint" id="dropzoneHint">Dépose ton PDF ici</div>
        <div class="hint2">ou clique pour choisir un fichier</div>
        <div class="filename hidden" id="filename"></div>
      </div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>
 
    <!-- ÉTAPE : mot de passe requis -->
    <div id="step-password" class="hidden">
      <div class="field">
        <label for="passwordInput">Ce PDF est protégé par un mot de passe</label>
        <input type="password" id="passwordInput" placeholder="Mot de passe du PDF">
        <div class="error-text hidden" id="passwordError">Mot de passe incorrect, réessaie.</div>
      </div>
      <button class="primary" id="unlockBtn">Déverrouiller</button>
      <button class="ghost" id="cancelBtn">Choisir un autre fichier</button>
    </div>
 
    <!-- ÉTAPE : traitement -->
    <div id="step-processing" class="hidden">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progressLabel">Lecture des pages…</span>
          <span id="progressCount"></span>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>
 
    <!-- ÉTAPE : terminé -->
    <div id="step-done" class="hidden">
      <div class="done-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="#6fa98a" stroke-width="1.6"/>
          <path d="M8 12.5l2.5 2.5L16 9.5" stroke="#6fa98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="done-title">PDF déverrouillé</div>
      <div class="done-sub" id="doneSub">Prêt à télécharger</div>
      <button class="primary" id="downloadBtn">Télécharger le PDF déverrouillé</button>
      <button class="ghost" id="restartBtn">Déverrouiller un autre fichier</button>
    </div>
 
    <!-- ÉTAPE : erreur générale -->
    <div id="step-error" class="hidden">
      <div class="error-text" id="generalError" style="margin-top:0;"></div>
      <button class="ghost" id="errorRestartBtn">Réessayer</button>
    </div>
 
  </div>
 
  <p class="ios-hint hidden" id="iosHint">⇧ puis « Sur l'écran d'accueil »</p>
 
  <footer class="footer">© 2026 Dametoti</footer>
 
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
